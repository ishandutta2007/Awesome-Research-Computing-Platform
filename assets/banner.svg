<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -80; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 3.5px; opacity: 0.7; }
        50% { r: 6.5px; opacity: 1; }
      }
      .floating-tag { animation: floatSlow 6s ease-in-out infinite; }
      .radar-line { transform-origin: 980px 210px; animation: radarSweep 12s linear infinite; }
      .data-stream { stroke-dasharray: 8, 12; animation: dashMove 3s linear infinite; }
      .dynamic-node { animation: nodePulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Glowing Orbs -->
  <rect width="1200" height="420" rx="16" fill="url(#glow-cyan)"/>
  <rect width="1200" height="420" rx="16" fill="url(#glow-purple)"/>

  <!-- Cyber Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#cyber-grid)"/>

  <!-- Tech Geometric Accents -->
  <g opacity="0.4">
    <!-- Concentric Target Circles (Right Side) -->
    <circle cx="980" cy="210" r="140" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,6"/>
    <circle cx="980" cy="210" r="95" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="980" cy="210" r="50" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="2,4"/>
    <circle cx="980" cy="210" r="8" fill="#38bdf8" opacity="0.8"/>
    
    <!-- Radar Sweep Beam -->
    <line x1="980" y1="210" x2="1120" y2="210" stroke="url(#accent-cyan)" stroke-width="2" class="radar-line"/>

    <!-- Dynamic Compute Cluster Nodes -->
    <circle cx="860" cy="120" r="4" fill="#38bdf8" class="dynamic-node" style="animation-delay: 0s;"/>
    <circle cx="1080" cy="100" r="5" fill="#a855f7" class="dynamic-node" style="animation-delay: 0.8s;"/>
    <circle cx="1050" cy="310" r="4" fill="#06b6d4" class="dynamic-node" style="animation-delay: 1.5s;"/>
    <circle cx="890" cy="300" r="5" fill="#ec4899" class="dynamic-node" style="animation-delay: 2.2s;"/>

    <!-- Cluster Interconnect Lines -->
    <line x1="860" y1="120" x2="980" y2="210" stroke="#38bdf8" stroke-width="1.5" class="data-stream"/>
    <line x1="1080" y1="100" x2="980" y2="210" stroke="#818cf8" stroke-width="1.5" class="data-stream"/>
    <line x1="1050" y1="310" x2="980" y2="210" stroke="#a855f7" stroke-width="1.5" class="data-stream"/>
    <line x1="890" y1="300" x2="980" y2="210" stroke="#06b6d4" stroke-width="1.5" class="data-stream"/>
  </g>

  <!-- Left Futuristic Tech Circuit Paths -->
  <g opacity="0.35">
    <path d="M 0 180 L 120 180 L 180 120 L 320 120" fill="none" stroke="#0284c7" stroke-width="1.5" class="data-stream"/>
    <circle cx="320" cy="120" r="3" fill="#38bdf8"/>
    <path d="M 0 280 L 140 280 L 200 340 L 380 340" fill="none" stroke="#7c3aed" stroke-width="1.5" class="data-stream"/>
    <circle cx="380" cy="340" r="3" fill="#c084fc"/>
  </g>

  <!-- Top Category Tag / Eyebrow -->
  <g transform="translate(80, 75)">
    <rect width="270" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="4" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">RESEARCH COMPUTING 2026</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 155)">
    <text fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#subtle-glow)">Awesome Research Computing</text>
    <text y="50" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">Platforms &amp; Ecosystem</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 255)">
    <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      Curated directory of SaaS &amp; Open-Source platforms for Interactive Notebooks,
    </text>
    <text y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.2">
      Cloud Supercomputing, HPC Portals, Distributed AI &amp; Scientific Research Workspaces.
    </text>
  </g>

  <!-- Pill Badges at Bottom -->
  <g transform="translate(80, 325)">
    <!-- Pill 1: Open OnDemand & Portals -->
    <g transform="translate(0, 0)">
      <rect width="165" height="34" rx="17" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="14" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">⚡ HPC Web Portals</text>
    </g>
    <!-- Pill 2: Interactive Notebooks -->
    <g transform="translate(180, 0)">
      <rect width="185" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
      <text x="14" y="21" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">📓 Interactive Notebooks</text>
    </g>
    <!-- Pill 3: Distributed Clusters -->
    <g transform="translate(380, 0)">
      <rect width="175" height="34" rx="17" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
      <text x="14" y="21" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">🚀 Distributed Clusters</text>
    </g>
    <!-- Pill 4: Open Source First -->
    <g transform="translate(570, 0)">
      <rect width="160" height="34" rx="17" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="21" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">🔬 Open-Source First</text>
    </g>
  </g>

  <!-- Outer Border Glow -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
</svg>
